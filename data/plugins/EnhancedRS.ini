[General]
SkipIntro = 0                      // Skips the intro logos.

[Input]
LookSensitivity = 1.0              // Multiplier applied to the in-game mouse sensitivity setting.

[HUD]
Scale = 1.0                        // Scales the HUD. 1.0 is the default 640x480 layout, while 0 keeps the HUD at its native pixel size.
